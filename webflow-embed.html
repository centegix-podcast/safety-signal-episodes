<style>
  .ss-podcast-widget { display:grid; grid-template-columns:3fr 2fr; gap:2rem; align-items:start; }
  @media (max-width: 767px) { .ss-podcast-widget { grid-template-columns: 1fr; } }
  .ss-player-wrap { position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:0.5rem; }
  .ss-player-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .ss-episode-list { display:flex; flex-direction:column; gap:0.5rem; max-height:420px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#0077c8 transparent; scrollbar-gutter:stable; }
  .ss-loading, .ss-fallback { opacity:0.6; font-size:0.875rem; }
  .ss-fallback a { color:inherit; text-decoration:underline; }
  .ss-episode-item { display:flex; gap:0.75rem; align-items:flex-start; cursor:pointer; padding:0.5rem; border-radius:0.375rem; transition:background 0.15s; }
  .ss-episode-item:hover { background:rgba(255,255,255,0.08); }
  .ss-episode-item.is-playing { background:rgba(0,119,200,0.18); }
  .ss-episode-item:focus-visible { outline:2px solid #0077c8; outline-offset:2px; }
  .ss-episode-thumb { width:110px; height:62px; object-fit:cover; border-radius:0.25rem; flex-shrink:0; }
  .ss-episode-date { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; opacity:0.6; margin-bottom:0.25rem; }
  .ss-episode-title { font-weight:600; font-size:0.9375rem; line-height:1.3; }
</style>
<div class="ss-podcast-widget">
  <div class="ss-player-wrap">
    <iframe id="ss-player" src="https://www.youtube-nocookie.com/embed/videoseries?listType=playlist&list=PLV_xxR5BiqNk" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
  <div id="ss-episode-list" class="ss-episode-list">
    <p class="ss-loading">Loading episodes&hellip;</p>
  </div>
</div>
<script>
(function () {
  var EPISODES_URL = "https://raw.githubusercontent.com/centegix-podcast/safety-signal-episodes/main/episodes.json";
  var PLAYLIST_ID = "PLV_xxR5BiqNk";
  var PLAYLIST_URL = "https://www.youtube.com/playlist?list=" + PLAYLIST_ID;

  var listEl = document.getElementById("ss-episode-list");
  var playerEl = document.getElementById("ss-player");

  function clearChildren(el) {
    while (el.firstChild) {
      el.removeChild(el.firstChild);
    }
  }

  function formatDate(isoString) {
    if (!isoString) return "";
    var d = new Date(isoString);
    if (isNaN(d.getTime())) return "";
    var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  function playVideo(videoId, rowEl) {
    playerEl.src = "https://www.youtube-nocookie.com/embed/" + videoId + "?autoplay=1&rel=0&playsinline=1";

    var rows = listEl.querySelectorAll(".ss-episode-item");
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.remove("is-playing");
    }
    rowEl.classList.add("is-playing");
  }

  function buildRow(entry) {
    var row = document.createElement("div");
    row.className = "ss-episode-item";
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.setAttribute("aria-label", "Play episode: " + entry.title);

    var img = document.createElement("img");
    img.className = "ss-episode-thumb";
    img.src = entry.thumbnail;
    img.width = 110;
    img.height = 62;
    img.loading = "lazy";
    img.alt = "";

    var meta = document.createElement("div");

    var dateEl = document.createElement("div");
    dateEl.className = "ss-episode-date";
    dateEl.textContent = formatDate(entry.published);

    var titleEl = document.createElement("div");
    titleEl.className = "ss-episode-title";
    titleEl.textContent = entry.title;

    meta.appendChild(dateEl);
    meta.appendChild(titleEl);

    row.appendChild(img);
    row.appendChild(meta);

    row.addEventListener("click", function () {
      playVideo(entry.videoId, row);
    });

    row.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " " || e.keyCode === 13 || e.keyCode === 32) {
        e.preventDefault();
        playVideo(entry.videoId, row);
      }
    });

    return row;
  }

  function renderEpisodes(entries) {
    var fragment = document.createDocumentFragment();
    for (var i = 0; i < entries.length; i++) {
      fragment.appendChild(buildRow(entries[i]));
    }
    clearChildren(listEl);
    listEl.appendChild(fragment);
  }

  function renderFallback() {
    clearChildren(listEl);
    var p = document.createElement("p");
    p.className = "ss-fallback";
    var a = document.createElement("a");
    a.href = PLAYLIST_URL;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "View the full playlist on YouTube";
    p.appendChild(document.createTextNode("Couldn't load episodes. "));
    p.appendChild(a);
    listEl.appendChild(p);
  }

  fetch(EPISODES_URL)
    .then(function (res) {
      if (!res.ok) throw new Error("Bad response: " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (!data || !data.entries || !data.entries.length) throw new Error("No entries");
      renderEpisodes(data.entries);
    })
    .catch(function () {
      renderFallback();
    });
})();
</script>
